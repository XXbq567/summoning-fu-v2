<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>召唤符 · Paperlab 完整动效</title>
<link rel="stylesheet" href="window.css">
</head>
<body class="motion-preview">
<header><span class="eyebrow">召唤符 · 本机独立预览</span><h1>取纸，落墨，燃尽。</h1><p id="preview-policy" class="muted"></p></header>
<div class="preview-layout">
<div class="preview-stage">
<main id="preview-paper" aria-label="召唤符 Paperlab 完整动效预览"></main>
<button id="example-send" data-preview="replay">示例发送 ↗</button>
<span class="example-note">本窗口示例按钮 · 不会发送聊天</span>
</div>
<section class="preview-panel">
<p id="preview-stage" class="state">正在准备 Paperlab 纸张</p>
<p id="preview-error" class="preview-error" role="alert" hidden></p>
<p id="preview-time" class="preview-time">等待纸张与字体准备完成</p>
<progress id="preview-progress" value="0" max="1"></progress>
<div class="preview-buttons"><button data-preview="replay" disabled>重新播放</button><button id="pause-preview" disabled>暂停</button><button data-preview="stop" disabled>停止</button></div>
<label class="preview-speed">播放速度 <select id="preview-speed" disabled><option value="1">正常</option><option value="0.5">半速</option><option value="0.25">四分之一速</option></select></label>
<h2>停在一个阶段，仔细看</h2>
<div class="preview-chapters"><button data-preview="point" disabled>一 · 取纸</button><button data-preview="unfold" disabled>二 · 纸身舒展</button><button data-preview="writing" disabled>三 · 落墨</button><button data-preview="hold" disabled>四 · 完整符</button><button data-preview="burning" disabled>五 · 燃尽</button><button data-preview="ash" disabled>六 · 余灰</button></div>
<p id="preview-source" class="muted"></p>
<p class="muted">与正常伴随层共用 Paperlab 渲染器。纸从本页示例按钮牵出，完整符面停留 5 秒后燃尽。隐藏或最小化暂停，关闭结束。本页不代表真实发送接入、任务完成或服务器确认。</p>
</section>
</div>
<script src="../renderer/ritual-core.js"></script>
<script src="../renderer/entrance-timeline.js"></script>
<script src="../renderer/send-geometry.js"></script>
<script src="../renderer/font-coverage.js"></script>
<script src="../renderer/generated/paperlab-runtime.js"></script>
<script src="../renderer/burn-view.js"></script>
<script src="motion-preview.js"></script>
</body>
</html>
